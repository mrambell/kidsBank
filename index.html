<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pocket Bank</title>
<meta name="description" content="A family bank for pocket money. Everything stays on this device.">
<meta name="theme-color" content="#0E6B53">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocket Bank">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="coin" aria-hidden="true">P</span>Pocket Bank</div>
    <div class="row"><button class="btn" id="install" type="button" hidden>Install app</button><button class="btn" id="lock" type="button">Parent</button></div>
  </header>
  <main id="app" style="display:flex;flex-direction:column;gap:16px"><p class="note">Opening the bank…</p></main>
</div>

<dialog id="pin">
  <form id="pin-form">
    <h2 id="pin-title">Parent PIN</h2>
    <p class="sub" id="pin-sub"></p>
    <input id="pin-in" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" aria-labelledby="pin-title" required>
    <p id="pin-err" role="alert"></p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" type="button" id="pin-cancel">Cancel</button>
      <button class="btn primary" type="submit">OK</button>
    </div>
  </form>
</dialog>
<dialog id="qr" class="wide"><div class="col">
  <h2 id="qr-title"></h2><p class="sub" id="qr-text"></p><p class="sub" id="qr-note"></p>
  <canvas id="qr-canvas" width="10" height="10"></canvas>
  <div class="row" style="justify-content:flex-end"><button class="btn" type="button" id="qr-copy"></button><button class="btn primary" type="button" id="qr-close"></button></div>
</div></dialog>
<dialog id="scan" class="wide"><div class="col">
  <h2 id="scan-title"></h2><p class="sub" id="scan-text"></p>
  <video id="scan-video" playsinline muted></video>
  <form class="col" id="scan-form"><label class="sub" for="scan-paste" id="scan-lab"></label><input class="paste" id="scan-paste" autocomplete="off">
  <div class="row" style="justify-content:flex-end"><button class="btn" type="button" id="scan-close"></button><button class="btn primary" type="submit" id="scan-use"></button></div></form>
</div></dialog>
<dialog id="imp" class="wide"><div class="col">
  <h2 id="imp-title"></h2><p class="sub" id="imp-text"></p>
  <div class="row" style="justify-content:flex-end"><button class="btn" type="button" id="imp-cancel"></button><button class="btn primary" type="button" id="imp-ok"></button></div>
</div></dialog>
<input type="file" id="file-in" accept="application/json,.json" hidden>
<div id="toast" role="status" hidden></div>

<!-- Bundled libraries: drawing and reading QR codes. They define window.qrcode and window.jsQR. -->
<script src="vendor/qrcode.js"></script>
<script src="vendor/jsQR.js"></script>
<!-- The app itself. Start reading at js/app.js. -->
<script type="module" src="js/app.js"></script>
</body>
</html>
