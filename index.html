<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Pocket Bank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: one narrow column like a savings passbook. Green balance cover on top, charts, then the ledger. Parent desk slides in under the cover when unlocked. */
:root{
  --bg:#EDF2F0; --card:#FFFFFF; --ink:#12302A; --muted:#5A716B; --line:#D5DFDB;
  --accent:#0E7A5E; --accent-ink:#FFFFFF; --coin:#F2B01E;
  --hero:#0E6B53; --hero-ink:#F3FBF7; --hero-soft:#BFE3D6;
  --s1:#1baf7a; --s2:#2a78d6; --s0:#8A9A95;
  --pos:#0B6B4F; --neg:#C2362F; --desk:#FFF7DF; --desk-line:#EBD38A;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1917; --card:#162522; --ink:#E7F0EC; --muted:#93A8A1; --line:#2A3B37;
  --accent:#37C299; --accent-ink:#06241C; --coin:#F5C24A;
  --hero:#114F40; --hero-ink:#F3FBF7; --hero-soft:#A9D6C6;
  --s1:#199e70; --s2:#3987e5; --s0:#7C8C87;
  --pos:#4FD1A8; --neg:#F08079; --desk:#2A2613; --desk-line:#5C5020;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1917; --card:#162522; --ink:#E7F0EC; --muted:#93A8A1; --line:#2A3B37;
  --accent:#37C299; --accent-ink:#06241C; --coin:#F5C24A;
  --hero:#114F40; --hero-ink:#F3FBF7; --hero-soft:#A9D6C6;
  --s1:#199e70; --s2:#3987e5; --s0:#7C8C87;
  --pos:#4FD1A8; --neg:#F08079; --desk:#2A2613; --desk-line:#5C5020;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body)}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
h2{font-size:1.15rem}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--coin);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:600 1.5rem var(--display)}
.coin{width:34px;height:34px;border-radius:50%;background:var(--coin);border:3px solid var(--ink);display:grid;place-items:center;font:600 1rem var(--display);color:#12302A}

.btn{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:7px 16px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:3px 12px;font-size:.85rem;border-width:1.5px}
.btn.danger{border-color:var(--neg);color:var(--neg)}
.btn:hover{filter:brightness(.96)}

.kids{display:flex;gap:8px;flex-wrap:wrap}
.kid{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px 4px 4px;font-weight:700;cursor:pointer}
.kid i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--line);display:grid;place-items:center;font:600 .9rem var(--display)}
.kid[aria-pressed="true"]{border-color:var(--ink)}
.kid[aria-pressed="true"] i{background:var(--coin);color:#12302A}

.note{border:1.5px dashed var(--muted);border-radius:12px;padding:10px 14px;color:var(--muted);font-size:.92rem}

.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:6px}
.hero .lab{color:var(--hero-soft);font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.hero .big{font:600 clamp(2.6rem,11vw,4rem)/1 var(--display);font-variant-numeric:tabular-nums}
.split{display:flex;gap:8px 22px;flex-wrap:wrap;margin-top:8px}
.split div{display:flex;flex-direction:column}
.split b{font:600 1.25rem var(--display);font-variant-numeric:tabular-nums}
.split span{color:var(--hero-soft);font-size:.85rem}
.hero .rule{margin-top:10px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--hero-soft) 40%,transparent);font-size:.92rem;color:var(--hero-soft)}
.hero .rule b{color:var(--hero-ink)}

.card{background:var(--card);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%}
.chart text{font:400 11px var(--body);fill:var(--muted)}
.tip{position:absolute;top:4px;pointer-events:none;background:var(--card);border:1.5px solid var(--ink);border-radius:10px;padding:6px 10px;font-size:.8rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.tip div{display:flex;align-items:center;gap:6px}
.tip b{margin-left:auto;padding-left:12px}

.desk{background:var(--desk);border:2px solid var(--desk-line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.f{display:flex;flex-direction:column;gap:3px;font-size:.8rem;font-weight:700;color:var(--muted);min-width:0;flex:1 1 130px}
.f.narrow{flex:0 1 110px}
.f input,.f select{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:400;color:var(--ink);width:100%;min-width:0}
.check{display:flex;align-items:center;gap:8px;font-weight:700;flex:1 1 100%}
.check input{width:18px;height:18px;accent-color:var(--accent)}
details{border-top:1.5px solid var(--desk-line);padding-top:10px}
summary{font:600 1rem var(--display);cursor:pointer}
details>div,details>form{display:flex;flex-direction:column;gap:10px;margin-top:10px}

.book{overflow-x:auto}
table{border-collapse:collapse;width:100%;font:400 .85rem var(--mono);font-variant-numeric:tabular-nums}
th{font:700 .72rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 8px;border-bottom:2px solid var(--ink)}
td{padding:7px 8px;border-bottom:1px dotted var(--muted);white-space:nowrap;vertical-align:top}
td.what{white-space:normal;min-width:110px;font-family:var(--body)}
td.what small{display:block;color:var(--muted)}
.num{text-align:right}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:0 4px}

dialog{border:2px solid var(--ink);border-radius:18px;background:var(--card);color:var(--ink);padding:22px;max-width:min(340px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(8,20,17,.55)}
dialog form{display:flex;flex-direction:column;gap:12px}
#pin-in{font:500 1.8rem var(--mono);letter-spacing:.5em;text-align:center;width:100%;border:2px solid var(--line);border-radius:12px;padding:8px;background:var(--bg);color:var(--ink)}
#pin-err{color:var(--neg);font-weight:700;font-size:.9rem;min-height:1.3em;margin:0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-weight:700;font-size:.9rem;max-width:calc(100vw - 32px);text-align:center}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="coin" aria-hidden="true">P</span>Pocket Bank</div>
    <button class="btn" id="lock" type="button">Parent</button>
  </header>
  <main id="app" style="display:flex;flex-direction:column;gap:16px"><p class="note">Opening the bank…</p></main>
</div>

<dialog id="pin">
  <form id="pin-form">
    <h2 id="pin-title">Parent PIN</h2>
    <p class="sub" id="pin-sub"></p>
    <input id="pin-in" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" aria-labelledby="pin-title" required>
    <p id="pin-err" role="alert"></p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" type="button" id="pin-cancel">Cancel</button>
      <button class="btn primary" type="submit">OK</button>
    </div>
  </form>
</dialog>
<div id="toast" role="status" hidden></div>

<script>
/*CORE*/
function defaultState(){ return {v:1, lang:"en", currency:"€", pinHash:"", example:false,
  interest:{on:false, rate:1, per:"month"}, invest:{on:false, rate:6, swing:3}, kids:[]}; }
function nextYm(s){ let y=+s.slice(0,4), m=+s.slice(5,7)+1; if(m>12){m=1;y++} return y+"-"+String(m).padStart(2,"0"); }
function rand01(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
  h+=0x6D2B79F5; let t=Math.imul(h^(h>>>15),1|h); t^=t+Math.imul(t^(t>>>7),61|t); return ((t^(t>>>14))>>>0)/4294967296; }
function intRate(S){ const r=S.interest.rate/100; return S.interest.per==="month" ? r : Math.pow(1+r,1/12)-1; }
function invBase(S){ return Math.pow(1+S.invest.rate/100,1/12)-1; }
// balances from transactions dated before `before` (or all)
function bal(k,before){ let sav=0,inv=0,paid=0,int=0,ret=0;
  for(const t of k.tx){ if(before && t.d>=before) continue;
    if(t.t==="in"){sav+=t.a;paid+=t.a} else if(t.t==="out"){sav-=t.a;paid-=t.a}
    else if(t.t==="int"){sav+=t.a;int+=t.a} else if(t.t==="buy"){sav-=t.a;inv+=t.a}
    else if(t.t==="sell"){sav+=t.a;inv-=t.a} else if(t.t==="ret"){inv+=t.a;ret+=t.a} }
  return {sav,inv,paid,int,ret,total:sav+inv}; }
// post interest and investment results on the 1st of every month that has started
function settle(S,today){ const cur=today.slice(0,7); let changed=false;
  for(const k of S.kids){ let m=k.thru||cur; if(!k.thru){k.thru=cur;changed=true}
    while(m<cur){ m=nextYm(m); const d=m+"-01", b=bal(k,d);
      if(S.interest.on && b.sav>0){ const a=Math.round(b.sav*intRate(S)); if(a) k.tx.push({id:"i"+m,d,t:"int",a,n:""}); }
      if(S.invest.on && b.inv>0){ const r=invBase(S)+(rand01(k.id+m)*2-1)*S.invest.swing/100; const a=Math.round(b.inv*r); if(a) k.tx.push({id:"r"+m,d,t:"ret",a,n:""}); }
      k.thru=m; changed=true; }
    k.tx.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0); }
  return changed; }
/*END*/

const tr=(k,v)=>{ let s=(L[S.lang]||L.en)[k]; if(s==null) s=L.en[k]; if(v) for(const x in v) s=s.split("{"+x+"}").join(v[x]); return s; };
const mon=i=>tr("mon").split(",")[i];

const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const ms=d=>Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10));
const fdate=d=>+d.slice(8,10)+" "+mon(+d.slice(5,7)-1)+(d.slice(0,4)!==today().slice(0,4)?" "+d.slice(0,4):"");
const money=(c,whole)=>{ const n=(Math.abs(c)/100).toFixed(whole?0:2); return (c<0?"−":"")+esc(S.currency)+(S.lang&&S.lang!=="en"?n.replace(".",","):n); };
const rid=()=>Math.random().toString(36).slice(2,9);

let S=defaultState(), raw="", loaded=false, unlocked=false, docRef=null, stale=false;
const ui={kid:null, all:false, rules:false, accts:false, arm:null};
const KEY="pocketbank";

/* ---------- storage ---------- */
function adopt(data){ const j=JSON.stringify(data||null); if(loaded && j===raw) return; raw=j;
  S=Object.assign(defaultState(), data?JSON.parse(j):{}); settle(S,today()); loaded=true; render(); }
let chain=Promise.resolve();
function save(){ raw=JSON.stringify(S); render();
  if(!docRef){ try{localStorage.setItem(KEY,raw)}catch(e){ toast(tr("noStore")) } return; }
  const body=JSON.parse(raw);
  chain=chain.then(()=>docRef.set(body)).catch(()=>toast(tr("noSave"))); }
async function boot(){
  let db=null; try{ db=await (window.claude&&window.claude.use?window.claude.use("db"):null) }catch(e){}
  if(!db){ let d=null; try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){} adopt(d); return; }
  docRef=db.doc("bank/main");
  const timer=setTimeout(()=>{ stale=true; if(!loaded) adopt(null); else render(); },10000);
  docRef.onSnapshot(snap=>{ const was=stale; if(!snap.metadata.fromCache){clearTimeout(timer);stale=false}
      adopt(snap.exists?snap.data():null); if(was!==stale) render(); },
    ()=>{ clearTimeout(timer); stale=true; if(!loaded) adopt(null); else render(); });
}

/* ---------- PIN ---------- */
async function hash(pin){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("pocketbank:"+pin));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
let pinMode="enter";
function askPin(mode){ pinMode=mode; $("#pin-in").value=""; $("#pin-err").textContent="";
  $("#pin-title").textContent=tr(mode==="set"?"pinChoose":"pinTitle");
  $("#pin-sub").textContent=tr(mode==="set"?"pinSetSub":"pinEnterSub");
  $("#pin-cancel").textContent=tr("cancel");
  $("#pin").showModal(); $("#pin-in").focus(); }
$("#pin-cancel").onclick=()=>$("#pin").close();
$("#pin-form").addEventListener("submit",async e=>{ e.preventDefault(); const p=$("#pin-in").value;
  if(!/^\d{4}$/.test(p)){ $("#pin-err").textContent=tr("pin4"); return; }
  const h=await hash(p);
  if(pinMode==="set"){ S.pinHash=h; unlocked=true; $("#pin").close(); save(); toast(tr("pinSaved")); }
  else if(h===S.pinHash){ unlocked=true; $("#pin").close(); render(); }
  else { $("#pin-err").textContent=tr("pinWrong"); $("#pin-in").value=""; } });
$("#lock").onclick=()=>{ if(unlocked){unlocked=false;render()} else askPin(S.pinHash?"enter":"set"); };

let tt; function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,3500); }

/* ---------- render ---------- */
const kid=()=>S.kids.find(k=>k.id===ui.kid)||S.kids[0]||null;

function render(){
  document.documentElement.lang=L[S.lang]?S.lang:"en";
  $("#lock").textContent=tr(unlocked?"lockDesk":"parent");
  const k=kid(); let h="";
  if(stale) h+=`<p class="note">${tr("stale")}</p>`;
  if(S.example) h+=`<p class="note">${tr("example")}</p>`;
  if(S.kids.length>1) h+=`<nav class="kids" aria-label="${tr("accounts")}">${S.kids.map(x=>`<button type="button" class="kid" data-act="pick" data-id="${x.id}" aria-pressed="${x===k}"><i>${esc(x.name.slice(0,1).toUpperCase())}</i>${esc(x.name)}</button>`).join("")}</nav>`;
  if(!k) h+=`<p class="note">${tr(unlocked?"noAcctsOpen":"noAcctsLocked")}</p>`;
  else h+=hero(k);
  if(unlocked) h+=desk(k);
  if(k){
    h+=`<section class="card"><h2>${tr("grew",{name:esc(k.name)})}</h2><div id="lg1"></div><div class="chart" id="c1"></div></section>`;
    h+=`<section class="card"><h2>${tr("future")}</h2><div id="p2"></div><div id="lg2"></div><div class="chart" id="c2"></div></section>`;
    h+=book(k);
  }
  app.innerHTML=h;
  if(k){ drawHistory(k); drawFuture(k); }
}

function hero(k){ const b=bal(k), showInv=S.invest.on||b.inv!==0; let rule="";
  if(S.interest.on){ const nm=nextYm(today().slice(0,7))+"-01";
    rule+=tr(S.interest.per==="month"?"ruleIntM":"ruleIntY",{rate:S.interest.rate,date:fdate(nm),amt:money(Math.max(0,Math.round(b.sav*intRate(S))))}); }
  if(S.invest.on) rule+=tr("ruleInv",{rate:S.invest.rate});
  return `<section class="hero"><span class="lab">${tr("balance",{name:esc(k.name)})}</span><div class="big">${money(b.total)}</div>
   <div class="split">${showInv?`<div><b>${money(b.sav)}</b><span>${tr("savings")}</span></div><div><b>${money(b.inv)}</b><span>${tr("invested")}</span></div>`:""}
   <div><b>${money(b.paid)}</b><span>${tr("kept")}</span></div>
   ${S.interest.on||b.int?`<div><b>${b.int>=0?"+":""}${money(b.int)}</b><span>${tr("intEarned")}</span></div>`:""}
   ${showInv?`<div><b>${b.ret>=0?"+":""}${money(b.ret)}</b><span>${tr("invResult")}</span></div>`:""}</div>
   ${rule?`<div class="rule">${rule}</div>`:""}</section>`; }

function desk(k){ const b=k?bal(k):null, t=today(); let h=`<section class="desk"><h2>${tr("desk")}</h2>`;
  if(k) h+=`<form class="row" data-form="tx">
    <label class="f">${tr("what")}<select id="tx-type"><option value="in">${tr("addMoney")}</option><option value="out">${tr("takeOut")}</option>
      ${S.invest.on?`<option value="buy">${tr("toInv")}</option>`:""}${b.inv>0?`<option value="sell">${tr("fromInv")}</option>`:""}</select></label>
    <label class="f narrow">${tr("amount")} (${esc(S.currency)})<input id="tx-amt" type="number" step="0.01" min="0.01" inputmode="decimal" required></label>
    <label class="f">${tr("note")}<input id="tx-note" maxlength="40" placeholder="${tr("notePh")}"></label>
    <label class="f narrow" style="flex-basis:140px">${tr("date")}<input id="tx-date" type="date" max="${t}" value="${t}" required></label>
    <button class="btn primary" type="submit">${tr("recordFor",{name:esc(k.name)})}</button></form>`;
  h+=`<details data-d="rules" ${ui.rules?"open":""}><summary>${tr("rules")}</summary><form data-form="rules">
    <div class="row"><label class="check"><input type="checkbox" id="r-int" ${S.interest.on?"checked":""}>${tr("payInt")}</label>
      <label class="f narrow">${tr("rate")}<input id="r-rate" type="number" step="0.1" min="0" max="50" value="${S.interest.rate}"></label>
      <label class="f narrow">${tr("per")}<select id="r-per"><option value="month" ${S.interest.per==="month"?"selected":""}>${tr("month")}</option><option value="year" ${S.interest.per==="year"?"selected":""}>${tr("year")}</option></select></label></div>
    <div class="row"><label class="check"><input type="checkbox" id="r-inv" ${S.invest.on?"checked":""}>${tr("allowInv")}</label>
      <label class="f narrow">${tr("avgYear")}<input id="r-irate" type="number" step="0.5" min="-20" max="100" value="${S.invest.rate}"></label>
      <label class="f narrow">${tr("swing")}<input id="r-swing" type="number" step="0.5" min="0" max="30" value="${S.invest.swing}"></label></div>
    <p class="sub">${tr("rulesNote")}</p>
    <div class="row"><label class="f narrow" style="flex-basis:140px">${tr("language")}<select id="r-lang">${Object.keys(LANGS).map(c=>`<option value="${c}" ${(S.lang||"en")===c?"selected":""}>${LANGS[c]}</option>`).join("")}</select></label>
      <label class="f narrow">${tr("currency")}<input id="r-cur" maxlength="3" value="${esc(S.currency)}"></label><button class="btn primary" type="submit">${tr("saveRules")}</button></div></form></details>`;
  h+=`<details data-d="accts" ${ui.accts||!k?"open":""}><summary>${tr("acctsPin")}</summary><div>
    ${S.kids.map(x=>`<div class="row"><label class="f">${tr("name")}<input id="n-${x.id}" maxlength="20" value="${esc(x.name)}"></label>
      <button class="btn small" type="button" data-act="rename" data-id="${x.id}">${tr("rename")}</button>
      <button class="btn small danger" type="button" data-act="remove" data-id="${x.id}">${tr(ui.arm===x.id?"reallyClose":"close")}</button></div>`).join("")}
    <form class="row" data-form="kid"><label class="f">${tr("newFor")}<input id="k-name" maxlength="20" placeholder="${tr("childName")}" required></label><button class="btn primary" type="submit">${tr("open")}</button></form>
    <div class="row"><button class="btn small" type="button" data-act="pin">${tr("changePin")}</button>
      ${S.example?`<button class="btn small danger" type="button" data-act="clear">${tr("clearEx")}</button>`:""}</div></div></details>`;
  return h+`</section>`; }

function book(k){ let run=0; const rows=k.tx.map(t=>{ const d=(t.t==="in"||t.t==="int"||t.t==="ret")?t.a:(t.t==="out"?-t.a:0); run+=d; return {t,d,run}; }).reverse();
  const shown=ui.all?rows:rows.slice(0,12);
  return `<section class="card"><h2>${tr("passbook")}</h2><div class="book"><table><thead><tr><th>${tr("thDate")}</th><th>${tr("thEntry")}</th><th class="num">${tr("thAmount")}</th><th class="num">${tr("thBalance")}</th>${unlocked?"<th></th>":""}</tr></thead><tbody>
  ${shown.map(r=>{ const t=r.t, move=t.t==="buy"||t.t==="sell";
    return `<tr><td>${fdate(t.d)}</td><td class="what">${tr(t.t==="ret"&&t.a<0?"t_dip":"t_"+t.t)}${t.n?`<small>${esc(t.n)}</small>`:""}</td>
    <td class="num ${move?"mut":r.d<0?"neg":"pos"}">${move?money(t.a):(r.d<0?"":"+")+money(r.d)}</td><td class="num">${money(r.run)}</td>
    ${unlocked?`<td>${["in","out","buy","sell"].includes(t.t)?`<button class="x" type="button" data-act="del" data-id="${t.id}" aria-label="${tr("delEntry")}">×</button>`:""}</td>`:""}</tr>`; }).join("")||`<tr><td colspan="5" class="mut">${tr("nothing")}</td></tr>`}
  </tbody></table></div>${rows.length>12?`<div><button class="btn small" type="button" data-act="all">${ui.all?tr("showFewer"):tr("showAll",{n:rows.length})}</button></div>`:""}</section>`; }

/* ---------- actions ---------- */
app.addEventListener("click",e=>{ const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act, id=b.dataset.id;
  if(a==="pick"){ ui.kid=id; ui.all=false; render(); return; }
  if(a==="all"){ ui.all=!ui.all; render(); return; }
  if(!unlocked) return;
  if(a==="pin") askPin("set");
  else if(a==="rename"){ const v=$("#n-"+id).value.trim(); if(v){ S.kids.find(k=>k.id===id).name=v; save(); toast(tr("renamed")); } }
  else if(a==="remove"){ if(ui.arm!==id){ ui.arm=id; ui.accts=true; render(); } else { S.kids=S.kids.filter(k=>k.id!==id); ui.arm=null; save(); toast(tr("closed")); } }
  else if(a==="clear"){ S.kids=[]; S.example=false; ui.accts=true; save(); toast(tr("cleared")); }
  else if(a==="del"){ const k=kid(); k.tx=k.tx.filter(t=>t.id!==id); save(); toast(tr("deleted")); } });
app.addEventListener("toggle",e=>{ const d=e.target.dataset&&e.target.dataset.d; if(d) ui[d]=e.target.open; },true);
app.addEventListener("submit",e=>{ e.preventDefault(); if(!unlocked) return; const f=e.target.dataset.form;
  if(f==="tx"){ const k=kid(), b=bal(k), t=$("#tx-type").value, a=Math.round(parseFloat($("#tx-amt").value)*100), d=$("#tx-date").value;
    if(!(a>0)) return toast(tr("amtZero"));
    if(!d||d>today()) return toast(tr("dateBad"));
    if((t==="out"||t==="buy")&&a>b.sav) return toast(tr("savOnly",{amt:money(b.sav)}));
    if(t==="sell"&&a>b.inv) return toast(tr("invOnly",{amt:money(b.inv)}));
    k.tx.push({id:rid(),d,t,a,n:$("#tx-note").value.trim()}); k.tx.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0); save(); toast(tr("recorded",{what:tr("t_"+t),amt:money(a)})); }
  else if(f==="rules"){ const n=(id,d)=>{const v=parseFloat($(id).value);return isFinite(v)?v:d};
    S.interest={on:$("#r-int").checked, rate:n("#r-rate",1), per:$("#r-per").value};
    S.invest={on:$("#r-inv").checked, rate:n("#r-irate",6), swing:Math.abs(n("#r-swing",3))};
    S.currency=$("#r-cur").value.trim()||"€"; S.lang=$("#r-lang").value; ui.rules=true; save(); toast(tr("rulesSaved")); }
  else if(f==="kid"){ const v=$("#k-name").value.trim(); if(!v) return; const id=rid();
    S.kids.push({id,name:v,thru:today().slice(0,7),tx:[]}); ui.kid=id; ui.accts=false; save(); toast(tr("opened",{name:v})); } });

/* ---------- charts ---------- */
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function legend(el,names,cols){ el.innerHTML=names.length>1?`<div class="legend">${names.map((n,i)=>`<span><i class="sw" style="background:var(${cols[i]})"></i>${n}</span>`).join("")}</div>`:""; }
// o: rows [{x,vals[]}], names, cols (css var names), stack, step, ticks [{x,label,anchor}], xLabel(x)
function chart(el,o){
  const W=Math.max(260,el.clientWidth), H=220, Lm=46, R=10, T=10, B=24, n=o.names.length;
  const tops=o.rows.map(r=>{let s=0;return r.vals.map(v=>o.stack?(s+=v):v)});
  const x0=o.rows[0].x, x1=Math.max(o.rows[o.rows.length-1].x,x0+1);
  let vmax=Math.max(1,...tops.flat()); const p=Math.pow(10,Math.floor(Math.log10(vmax)));
  const stepY=[1,2,5,10].map(s=>s*p).find(s=>vmax/s<=4); const ymax=Math.ceil(vmax/stepY)*stepY;
  const X=x=>Lm+(x-x0)/(x1-x0)*(W-Lm-R), Y=v=>T+(1-Math.max(0,v)/ymax)*(H-T-B);
  const line=i=>{ const pts=[]; o.rows.forEach((r,j)=>{ const v=i<0?0:tops[j][i]; if(o.step&&j) pts.push([X(r.x),Y(i<0?0:tops[j-1][i])]); pts.push([X(r.x),Y(v)]); }); return pts; };
  const d=pts=>pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join("");
  let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(o.aria)}">`;
  for(let v=0;v<=ymax+1;v+=stepY) s+=`<line x1="${Lm}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${css("--line")}" stroke-width="1"/><text x="${Lm-6}" y="${Y(v)+4}" text-anchor="end">${money(v,stepY>=100)}</text>`;
  o.ticks.forEach(t=>{ s+=`<text x="${X(t.x)}" y="${H-6}" text-anchor="${t.anchor||"middle"}">${t.label}</text>`; });
  for(let i=n-1;i>=0;i--){ const top=line(i), c=css(o.cols[i]);
    if(o.stack){ const bot=line(i-1).reverse(); s+=`<path d="${d(top)}${d(bot).replace(/M/g,"L")}Z" fill="${c}" fill-opacity=".28" stroke="none"/>`; }
    s+=`<path d="${d(top)}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" ${o.dash&&o.dash[i]?'stroke-dasharray="5 4"':""}/>`; }
  const last=o.rows.length-1; for(let i=0;i<n;i++) s+=`<circle cx="${X(o.rows[last].x)}" cy="${Y(tops[last][i])}" r="4" fill="${css(o.cols[i])}" stroke="${css("--card")}" stroke-width="2"/>`;
  s+=`<g class="hv" visibility="hidden"><line y1="${T}" y2="${H-B}" stroke="${css("--muted")}" stroke-width="1"/>${o.names.map((_,i)=>`<circle r="4" fill="${css(o.cols[i])}" stroke="${css("--card")}" stroke-width="2"/>`).join("")}</g>`;
  s+=`<rect x="${Lm}" y="${T}" width="${W-Lm-R}" height="${H-T-B}" fill="transparent"/></svg><div class="tip" hidden></div>`;
  el.innerHTML=s;
  const hv=el.querySelector(".hv"), tip=el.querySelector(".tip"), svg=el.querySelector("svg");
  const move=e=>{ const bx=svg.getBoundingClientRect(), px=(e.clientX-bx.left)*W/bx.width, xv=x0+(px-Lm)/(W-Lm-R)*(x1-x0);
    let j=0; if(o.step){ o.rows.forEach((r,i)=>{ if(r.x<=xv) j=i; }); } else { let best=1/0; o.rows.forEach((r,i)=>{ const q=Math.abs(r.x-xv); if(q<best){best=q;j=i} }); }
    const cx=o.step?Math.min(Math.max(px,Lm),W-R):X(o.rows[j].x);
    hv.setAttribute("visibility","visible"); hv.querySelector("line").setAttribute("x1",cx); hv.querySelector("line").setAttribute("x2",cx);
    hv.querySelectorAll("circle").forEach((c,i)=>{ c.setAttribute("cx",cx); c.setAttribute("cy",Y(tops[j][i])); });
    const r=o.rows[j]; tip.innerHTML=`<div><strong>${o.xLabel(o.step?Math.max(x0,Math.min(xv,x1)):r.x)}</strong></div>`+
      o.names.map((nm,i)=>`<div><i class="sw" style="background:var(${o.cols[i]})"></i>${nm}<b>${money(r.vals[i])}</b></div>`).reverse().join("")+
      (o.stack&&n>1?`<div>${tr("total")}<b>${money(r.vals.reduce((a,b)=>a+b,0))}</b></div>`:"");
    tip.hidden=false; const w=tip.offsetWidth, sx=cx*bx.width/W; tip.style.left=Math.max(0,Math.min(sx+10+w>bx.width?sx-10-w:sx+10,bx.width-w))+"px"; };
  svg.addEventListener("pointermove",move); svg.addEventListener("pointerdown",move);
  svg.addEventListener("pointerleave",()=>{ hv.setAttribute("visibility","hidden"); tip.hidden=true; });
}

function drawHistory(k){ const el=$("#c1"), t=today(), showInv=S.invest.on||k.tx.some(x=>x.t==="buy");
  const dates=[...new Set(k.tx.map(x=>x.d))].sort(); let sav=0,inv=0,i=0; const rows=[];
  const start=dates[0]||t; rows.push({x:ms(start)-864e5*2,vals:showInv?[0,0]:[0]});
  for(const d of dates){ for(;i<k.tx.length&&k.tx[i].d<=d;i++){ const b=bal({tx:[k.tx[i]]}); sav+=b.sav; inv+=b.inv; } rows.push({x:ms(d),vals:showInv?[sav,inv]:[sav]}); }
  if(ms(t)>rows[rows.length-1].x) rows.push({x:ms(t),vals:rows[rows.length-1].vals.slice()});
  const x0=rows[0].x, x1=rows[rows.length-1].x, ticks=[]; let y=new Date(x0).getUTCFullYear(), m=new Date(x0).getUTCMonth()+1;
  for(;;m++){ if(m>11){m=0;y++} const x=Date.UTC(y,m,1); if(x>x1) break; ticks.push({x,label:mon(m)+(m===0?" "+y:"")}); }
  const every=Math.ceil(ticks.length/6), span=x1-x0;
  const names=showInv?[tr("savings"),tr("invested")]:[tr("savings")], cols=["--s1","--s2"];
  legend($("#lg1"),names,cols);
  chart(el,{rows,names,cols,stack:true,step:true,aria:tr("ariaHist"),
    ticks:ticks.filter((q,j)=>j%every===0&&(q.x-x0)/span>.04&&(q.x-x0)/span<.97),
    xLabel:x=>{const d=new Date(x);return d.getUTCDate()+" "+mon(d.getUTCMonth())+" "+d.getUTCFullYear()}}); }

function drawFuture(k){ const el=$("#c2"), b=bal(k), p=$("#p2");
  if(!(S.interest.on||(S.invest.on&&b.inv>0))||b.total<=0){ el.innerHTML=""; $("#lg2").innerHTML="";
    p.innerHTML=`<p class="sub">${tr(b.total<=0?"futEmpty":"futOff")}</p>`; return; }
  let sav=b.sav, inv=b.inv; const rows=[{x:0,vals:[b.total,b.total]}];
  for(let m=1;m<=60;m++){ if(S.interest.on) sav*=1+intRate(S); if(S.invest.on) inv*=1+invBase(S); rows.push({x:m,vals:[b.total,Math.round(sav+inv)]}); }
  p.innerHTML=`<p class="sub">${tr("futText",{a:money(b.total),b:money(rows[60].vals[1])})}</p>`;
  const names=[tr("piggy"),tr("inBank")], cols=["--s0","--s1"];
  legend($("#lg2"),names,cols);
  chart(el,{rows,names,cols,stack:false,step:false,dash:[true,false],aria:tr("ariaFut"),
    ticks:[0,12,24,36,48,60].map(x=>({x,label:x?x/12+" "+tr("yr"):tr("today"),anchor:x===0?"start":x===60?"end":"middle"})),
    xLabel:x=>x?(x>=12?Math.floor(x/12)+" "+tr("yr")+" ":"")+(x%12?x%12+" "+tr("mo"):""):tr("today")}); }

let rw; new ResizeObserver(()=>{ clearTimeout(rw); rw=setTimeout(()=>{ const k=kid(); if(k&&$("#c1")){ drawHistory(k); drawFuture(k); } },120); }).observe(app);
new MutationObserver(()=>{ if(loaded) render(); }).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
boot();
</script>
